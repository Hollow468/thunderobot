# DKMS configuration for Thunderobot platform modules
PACKAGE_NAME="thunderobot"
PACKAGE_VERSION="1.0.0"

MAKE="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]=thunderobot-core
BUILT_MODULE_NAME[1]=thunderobot-gpu
BUILT_MODULE_NAME[2]=thunderobot-led

DEST_MODULE_LOCATION[0]=/kernel/drivers/platform/x86
DEST_MODULE_LOCATION[1]=/kernel/drivers/platform/x86
DEST_MODULE_LOCATION[2]=/kernel/drivers/platform/x86

AUTOINSTALL=yes
